
<!DOCTYPE html>
<html>
<head>
    <title>Graph MATEMATIKA</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style type="text/css">
        #mynetwork {
            width: 1080px;
            height: 2160px;
            border: 1px solid lightgray;
        }
    </style>
</head>
<body>
<div id="mynetwork"></div>
<script type="text/javascript">
    // Function to generate pie chart SVG
    function generatePieChart(green, red, outline) {
        const total = green + red;  // pomer green:red = 0:0 znamena, ze vykreslime zeleny obrys s bilym stredem
        const greenAngle = total > 0 ? 2 * Math.PI * green / total : 0;
        const redAngle   = total > 0 ? 2 * Math.PI * red / total   : 0; 
        const radius = 40;
        const outlineRadius = 50;
        const outlineWidth = 10;
        const outlineColor = red > 0 ? 'red' : 'green';

        let svg = `<svg width="${outlineRadius * 2}" height="${outlineRadius * 2}" viewBox="0 0 ${outlineRadius * 2} ${outlineRadius * 2}" xmlns="http://www.w3.org/2000/svg">`;

        // barevny obrys dle green/red
        if (outline > 0) {
            svg += `<circle cx="${outlineRadius}" cy="${outlineRadius}" r="${outlineRadius}" fill="${outlineColor}" />`;
        }

        // cerny obrys s sedou vyplni pro startnode
        if (outline < 0) {
            svg += `<circle cx="${outlineRadius}" cy="${outlineRadius}" r="${outlineRadius}" fill="black" />`;
            svg += `<circle cx="${outlineRadius}" cy="${outlineRadius}" r="${radius}" fill="rgb(200,200,200)" />`;
        }

        else
        // bila vypln
        if (green == 0 && red == 0) {
          svg += `<circle cx="${outlineRadius}" cy="${outlineRadius}" r="${radius}" fill="white" />`;
        }  

        else
        // zelena vypln
        if (green > 0 && red == 0) {
          svg += `<circle cx="${outlineRadius}" cy="${outlineRadius}" r="${radius}" fill="rgb(120,255,120)" />`;
        }

        else
        // cervena vypln
        if (green == 0 && red > 0) {
          svg += `<circle cx="${outlineRadius}" cy="${outlineRadius}" r="${radius}" fill="rgb(255,120,120)" />`;
        }

        else
        // delena vypln - obe vysece
        if (green > 0 && red > 0) {
            svg += `<path d="M${outlineRadius},${outlineRadius} L${outlineRadius},${outlineRadius - radius} A${radius},${radius} 0 ${greenAngle > Math.PI ? 1 : 0},1 ${outlineRadius + radius * Math.sin(greenAngle)},${outlineRadius - radius * Math.cos(greenAngle)} Z" fill="rgb(120,255,120)" />`;
            svg += `<path d="M${outlineRadius},${outlineRadius} L${outlineRadius + radius * Math.sin(greenAngle)},${outlineRadius - radius * Math.cos(greenAngle)} A${radius},${radius} 0 ${redAngle > Math.PI ? 1 : 0},1 ${outlineRadius},${outlineRadius - radius} Z" fill="rgb(255,120,120)" />`;
        }


        svg += `</svg>`;
        return `data:image/svg+xml;base64,${btoa(svg)}`;
    }

    // Parse URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const outline   = parseInt(urlParams.get('outline')) || 0;
    const startnode = parseInt(urlParams.get('startnode')) || 0;
    const score     = parseInt(urlParams.get('score')) || null;     
    let nodesCount  = parseInt(urlParams.get('nodes')) || 0;
    let edgesCount  = nodesCount;

    // Create nodes
    
    // sem vlozit seznam nodu konkretniho grafu
    //const nodeName = ["1 aaaa","2 bbbb","3 ccc","4 dddd","5 eeee","6 fffff"];
    //nodesCount = 6;
    //nasledujici seznam nodu generujeme z db
    const nodeName = [
                      "0\nMATEMATIKA",
                      "1\nAritmetické operace",
                      "2\nSčítání",
                      "3\nOdčítání",
                      "4\nNásobení",
                      "5\nDělení",
                      "6\nMocnina",
                      "7\nOdmocnina",
                      "8\nPriorita aritmetických operací",
                      "9\nKomutativita",
                      "10\nAsociativita",
                      "11\nDistributivita",
                      "12\nVlastnosti\nsčítání",
                      "13\nVlastnosti\nodčítání",
                      "14\nVlastnosti\nnásobení",
                      "15\nVlastnosti\ndělení",
                      "16\nVlastnosti\nmocniny",
                      "17\nVlastnosti\n(druhé) odmocniny",
                      "18\nGoniometrie",
                      "19\nSinus",
                      "20\nKosinus",
                      "21\nTangens",
                      "22\nKotangens",
                      "23\nGoniometrické\nvzorce základní",
                      "24\nGoniometr.\nvzorce\nsoučtu\na rozdílu",
                      "25\nGoniometr.\nvzorce\ndvojnásobného\núhlu",
                      "26\nGoniometr.\nvzorce\npolovičního\núhlu",
                      "27\nGoniometr.\nvzorce\nsoučinu",
                      "28\nSOUHRN",
                      ""];
    nodesCount = 29

    const nodes = [];

    for (let i = 0; i < nodesCount; i++) {
        const fillParam = urlParams.get(`fill${i}`);
        if (startnode == i || i == nodesCount-1) {
            nodes.push({
                id: i,
                //label: `Node ${i}`,
                label: (startnode == i && score!=null) ? nodeName[i] + "\n(SCORE: " + score + ")" : nodeName[i],
                shape: 'image',
                image: generatePieChart(0, 0, -1)
            });
        } else 
        if (fillParam) {
            const [green, red] = fillParam.split(':').map(Number);
            nodes.push({
                id: i,
                //label: `Node ${i}`,
                label: (green + red) == 0 ? nodeName[i] : nodeName[i] + "\n(" + green + ":" + red + ")",
                shape: 'image',
                image: generatePieChart(green, red, outline)
            });
        } else {
            nodes.push({
                id: i,
                //label: `Node ${i}`,
                label: nodeName[i],
                shape: 'dot',
                size: 20
            });
        }
    }
    
    // Create edges
    
    //sem vlozit seznam vazeb
    //const edgePair = [[0,1],[0,2],[1,3],[2,3],[3,4],[3,5],[4,6],[5,6]];
    //edgesCount = 8;
    //nasledujici seznam vazeb generujeme z db
    const edgePair = [
                      [0,1],
                      [1,2],
                      [1,4],
                      [2,3],
                      [3,6],
                      [4,5],
                      [5,6],
                      [6,7],
                      [6,8],
                      [7,8],
                      [8,9],
                      [8,10],
                      [8,11],
                      [9,12],
                      [9,13],
                      [9,14],
                      [10,12],
                      [10,13],
                      [10,14],
                      [11,14],
                      [11,15],
                      [12,16],
                      [13,16],
                      [14,16],
                      [15,16],
                      [16,17],
                      [16,18],
                      [17,18],
                      [18,19],
                      [18,20],
                      [18,21],
                      [18,22],
                      [19,23],
                      [20,23],
                      [21,23],
                      [22,23],
                      [23,24],
                      [23,25],
                      [23,26],
                      [23,27],
                      [24,28],
                      [25,28],
                      [26,28],
                      [27,28],
                      [0,0]];
    edgesCount = 44
    
    const edges = [];

    for (let i = 0; i < edgesCount; i++) {
        //nahradni pospojovani, kdyz neni presna definice
        //if (i > 0) {
        //   edges.push({from: i - 1, to: i});
        //
        //}
        edges.push({from: edgePair[i][0], to: edgePair[i][1], arrows: "to"});  
    }

    // Create a network
    const container = document.getElementById('mynetwork');
    const data = {
        nodes: new vis.DataSet(nodes),
        edges: new vis.DataSet(edges)
    };
    //const options = {};
    var options = {
        layout: {
            hierarchical: {
                direction: "UD", // Směr: U (Up) › D (Down)
                sortMethod: "directed" // Uspořádání podle směru hran
                //levelSeparation: 80 // menší číslo = uzly blíž k sobě  // jen pro zplostely graf
            }
        },
        physics: {
            solver: "forceAtlas2Based",
            forceAtlas2Based: {
                avoidOverlap: 1 // Zabrání překrývání uzlů s hranami
            }
        },
        nodes: { 
            font: { 
                size: 20 // zvetseni fontu oproti defaultnimu
            }
        }
    };
    
    
    let network = new vis.Network(container, data, options);
    
    // dodatecne posuny uzlu
    network.stabilize(); // Stabilizuje graf po vykreslení
    
   network.moveNode(7, 100, -480);
   network.moveNode(17, 100, 300);

   // jen pro splostely graf
   // network.moveNode(2,-300, network.getPositions([2])[2].y);
   // network.moveNode(4, 300, network.getPositions([2])[2].y);
   // network.moveNode(7, 150, -280);
   // network.moveNode(17,150, 160);

    
</script>
</body>
</html>
